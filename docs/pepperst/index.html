<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pepper St Poker</title>
  <meta name="description" content="Pepper St Poker, Magnolia Park: a home game with no rake, no fees and no drama. Tournament recaps, house rules and champions.">
  <meta name="theme-color" content="#0c0909">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="Pepper St Poker home">
        <img src="logo.png" alt="" width="40" height="40">
        <span>Pepper St <b>Poker</b></span>
      </a>
      <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav">
        <span></span><span></span>
      </button>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <div class="foot-in">
      <div>
        <p class="foot-brand">Pepper St <b>Poker</b></p>
        <p class="muted">Magnolia Park · The Garage Around Back</p>
      </div>
      <p class="muted small">
        Posts are written on Blogger and appear here automatically.
        Originals at <a href="http://www.pepperstreetpoker.org/">pepperstreetpoker.org</a> and
        <a href="https://pepperstreetrules.blogspot.com/">Pepper Street Rules</a>.
      </p>
    </div>
  </footer>

  <dialog id="lightbox" aria-label="Photo">
    <form method="dialog"><button class="lb-close" aria-label="Close">✕</button></form>
    <img alt="">
  </dialog>

  <script src="app.js"></script>
</body>
</html>
